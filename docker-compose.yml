services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zilla
      POSTGRES_PASSWORD: zilla
      POSTGRES_DB: zilla_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zilla"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
